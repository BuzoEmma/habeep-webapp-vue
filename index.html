    {
      "@context": "https://schema.org/",

       "@type": "SpeakableSpecification",

      }

  <script type="application/ld+json">

        "@type": "AggregateRating",

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Property SearchBox",
      "url": "https://habeep.org/listings/search",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://habeep.org/listings/search?name={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
  </script>

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",

    }
  </script>

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "name": "Frequently Asked Question",
      "@type": "FAQPage",
      "mainEntity": [{
        "@type": "Question",
        "name": "What is Habeep?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "<p>Habeep is a marketplace which focuses on <b>Real Estate</b> .Individuals can register on this marketplace and view houses on the go, conteact agents or companies, setup a wallet and do many more. <a href=https://habeep.org/help> Click here </a> to learn more.</p>"
        }
      }, {
        "@type": "Question",
        "name": "How do i contact an agent?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "You can contact any agent from your home page In-App. Note that evry user has a personal tag created from their username. <a href=https://habeep.org/Beasty> Click to View a Profile with tag @Beasty </a>. You can also get hold of an agent from his listing"
        }
      }, {
        "@type": "Question",
        "name": "What is Habeep Term of Service?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "<p>You can view our term of service from <a href=https://habeep.org/terms-of-service>here</a> </p>"
        }
      }, {
        "@type": "Question",
        "name": "Do i need to pay to get started?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Habeep is completely free for everyone as far as your actions on our software abides with <a href=https://habeep.org/terms-of-service>Terms of Service</a>."
        }
      }]
    }
  </script>

    }
    </script>
